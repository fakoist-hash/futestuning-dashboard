name: Validate dashboard bundle
on:
  push:
    paths: ['dist/**', 'hacs.json', 'examples/**', 'tests/**', '.github/workflows/validate-dashboard.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript and HACS package
        run: |
          node --check dist/futestuning-dashboard.js
          node --check dist/futestuning-card.js
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('.')
          h=json.loads((p/'hacs.json').read_text())
          assert h['filename']=='futestuning-dashboard.js'
          expected=(p/'dist/futestuning-card.js').read_bytes()+b'\n;'+(p/'dist/otthon-card.js').read_bytes()
          assert (p/'dist/futestuning-dashboard.js').read_bytes()==expected
          assert (p/'examples/dashboard.yaml').is_file()
          PY
      - name: Check display-only template sensors
        run: |
          python3 -m pip install PyYAML Jinja2
          python3 tests/extension-template.py
          python3 tests/tech-monitoring.py
      - name: Install browser test tools
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check all three views, controls and service restrictions
        run: node tests/visual-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-previews-test-data
          path: test-results/*.png
