# Csak a három TECH indítási hőmérsékletet módosítja.
# A közös single script kizárja a párhuzamos be-/visszaállítást.
# Részleges hiba után a bekapcsolva maradó flag a visszaállítást engedi.
input_boolean:
  futestuning_electric_mode:
    name: Fűtéstuning elektromos kazán üzem – TECH
    icon: mdi:water-boiler
input_number:
  futestuning_tech_start_saved_1:
    name: TECH eredeti indítási hőmérséklet 1
    min: 10
    max: 80
    step: 1
    mode: box
  futestuning_tech_start_saved_2:
    name: TECH eredeti indítási hőmérséklet 2
    min: 10
    max: 80
    step: 1
    mode: box
  futestuning_tech_start_saved_3:
    name: TECH eredeti indítási hőmérséklet 3
    min: 10
    max: 80
    step: 1
    mode: box
script:
  futestuning_electric_tech_on:
    alias: Fűtéstuning – elektromos üzem (TECH)
    mode: single
    sequence:
    - action: script.futestuning_electric_tech_transition
      data:
        enable: true
  futestuning_electric_tech_off:
    alias: Fűtéstuning – normál üzem visszaállítás (TECH)
    mode: single
    sequence:
    - action: script.futestuning_electric_tech_transition
      data:
        enable: false
  futestuning_electric_tech_transition:
    alias: Fűtéstuning – kizárólagos TECH üzemmódváltás
    mode: single
    sequence:
    - choose:
      - conditions: '{{ enable is defined and enable == true }}'
        sequence:
        - condition: state
          entity_id: input_boolean.futestuning_electric_mode
          state: 'off'
        - condition: template
          value_template: "{% set ids = [\n  'number.wifi_rs_szivattyu_beallitasok_inditasi_homerseklet',\n  'number.wifi_rs_szivattyu_beallitasok_inditasi_homerseklet_2',\n\
            \  'number.wifi_rs_szivattyu_beallitasok_inditasi_homerseklet_3'\n] %} {{ ids | map('states') | map('is_number')\
            \ | select('equalto', false) | list | length == 0\n   and ids | map('states') | map('float') | min >=\
            \ 10\n   and ids | map('states') | map('float') | max <= 80 }}"
        - action: input_number.set_value
          target:
            entity_id: input_number.futestuning_tech_start_saved_1
          data:
            value: '{{ states(''number.wifi_rs_szivattyu_beallitasok_inditasi_homerseklet'') | float }}'
        - action: input_number.set_value
          target:
            entity_id: input_number.futestuning_tech_start_saved_2
          data:
            value: '{{ states(''number.wifi_rs_szivattyu_beallitasok_inditasi_homerseklet_2'') | float }}'
        - action: input_number.set_value
          target:
            entity_id: input_number.futestuning_tech_start_saved_3
          data:
            value: '{{ states(''number.wifi_rs_szivattyu_beallitasok_inditasi_homerseklet_3'') | float }}'
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.futestuning_electric_mode
        - repeat:
            for_each:
            - number.wifi_rs_szivattyu_beallitasok_inditasi_homerseklet
            - number.wifi_rs_szivattyu_beallitasok_inditasi_homerseklet_2
            - number.wifi_rs_szivattyu_beallitasok_inditasi_homerseklet_3
            sequence:
            - action: number.set_value
              target:
                entity_id: '{{ repeat.item }}'
              data:
                value: 10
      - conditions: '{{ enable is defined and enable == false }}'
        sequence:
        - condition: state
          entity_id: input_boolean.futestuning_electric_mode
          state: 'on'
        - condition: template
          value_template: "{% set ids = [\n  'input_number.futestuning_tech_start_saved_1',\n  'input_number.futestuning_tech_start_saved_2',\n\
            \  'input_number.futestuning_tech_start_saved_3'\n] %} {{ ids | map('states') | map('is_number') | select('equalto',\
            \ false) | list | length == 0 }}"
        - action: number.set_value
          target:
            entity_id: number.wifi_rs_szivattyu_beallitasok_inditasi_homerseklet
          data:
            value: '{{ states(''input_number.futestuning_tech_start_saved_1'') | float }}'
        - action: number.set_value
          target:
            entity_id: number.wifi_rs_szivattyu_beallitasok_inditasi_homerseklet_2
          data:
            value: '{{ states(''input_number.futestuning_tech_start_saved_2'') | float }}'
        - action: number.set_value
          target:
            entity_id: number.wifi_rs_szivattyu_beallitasok_inditasi_homerseklet_3
          data:
            value: '{{ states(''input_number.futestuning_tech_start_saved_3'') | float }}'
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.futestuning_electric_mode
