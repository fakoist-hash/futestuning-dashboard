# Fűtéstuning 2.0 — READ-ONLY TECH diagnostics (no extension).
# This is a Home Assistant package; install only after checking live entity IDs,
# backups, entity collisions, and the existing packages include configuration.
# MINI-D on/off is the demand/enable signal, NOT motor running feedback.
# No service calls, no automations, no pump/valve control.
#
# The three loops: 1=Pince, 2=Padlófűtés, 3=Radiátor.
# Source IDs from the user's 2026-10-28 HA entity inventory (historical).
template:
  - binary_sensor:
      - name: "Fűtéstuning puffer adat hiányzik"
        unique_id: futestuning_tech_buffer_missing
        default_entity_id: binary_sensor.futestuning_tech_buffer_missing
        device_class: problem
        state: >-
          {% set s=states('sensor.elite_thr316d_sonoff_1002bdc9e4_temperature') %}
          {{ not is_number(s) or (is_number(s) and (s|float < -20 or s|float > 110)) }}
        delay_on: "00:10:00"
        delay_off: "00:02:00"

      - name: "Fűtéstuning pince hőigényjel adat hiányzik"
        unique_id: futestuning_tech_basement_demand_missing
        default_entity_id: binary_sensor.futestuning_tech_basement_demand_missing
        device_class: problem
        state: >-
          {{ states('switch.pince_szivattyu_mini_d_sonoff_10029bc9f9_1') not in ['on','off'] }}
        delay_on: "00:10:00"
        delay_off: "00:02:00"

      - name: "Fűtéstuning padló hőigényjel adat hiányzik"
        unique_id: futestuning_tech_floor_demand_missing
        default_entity_id: binary_sensor.futestuning_tech_floor_demand_missing
        device_class: problem
        state: >-
          {{ states('switch.padlo_szivattyu_mini_d_sonoff_10029bc9ca_1') not in ['on','off'] }}
        delay_on: "00:10:00"
        delay_off: "00:02:00"

      - name: "Fűtéstuning radiátor hőigényjel adat hiányzik"
        unique_id: futestuning_tech_radiator_demand_missing
        default_entity_id: binary_sensor.futestuning_tech_radiator_demand_missing
        device_class: problem
        state: >-
          {{ states('switch.radiator_szivattyu_mini_d_sonoff_10029bc6bf_1') not in ['on','off'] }}
        delay_on: "00:10:00"
        delay_off: "00:02:00"

      - name: "Fűtéstuning TECH pince hőmérő adat hiányzik"
        unique_id: futestuning_tech_basement_temp_missing
        default_entity_id: binary_sensor.futestuning_tech_basement_temp_missing
        device_class: problem
        state: >-
          {% set s=states('sensor.wifi_rs_beepitett_szelep_1_homerseklet') %}
          {{ not is_number(s) or (is_number(s) and (s|float < -20 or s|float > 110)) }}
        delay_on: "00:10:00"
        delay_off: "00:02:00"

      - name: "Fűtéstuning TECH padló hőmérő adat hiányzik"
        unique_id: futestuning_tech_floor_temp_missing
        default_entity_id: binary_sensor.futestuning_tech_floor_temp_missing
        device_class: problem
        state: >-
          {% set s=states('sensor.wifi_rs_beepitett_szelep_2_homerseklet') %}
          {{ not is_number(s) or (is_number(s) and (s|float < -20 or s|float > 110)) }}
        delay_on: "00:10:00"
        delay_off: "00:02:00"

      - name: "Fűtéstuning TECH radiátor hőmérő adat hiányzik"
        unique_id: futestuning_tech_radiator_temp_missing
        default_entity_id: binary_sensor.futestuning_tech_radiator_temp_missing
        device_class: problem
        state: >-
          {% set s=states('sensor.wifi_rs_beepitett_szelep_3_homerseklet') %}
          {{ not is_number(s) or (is_number(s) and (s|float < -20 or s|float > 110)) }}
        delay_on: "00:10:00"
        delay_off: "00:02:00"

      # Persisting demand with a cold buffer is a *warning*, not proof of a pump fault.
      # Delayed to avoid notifications on ordinary buffer cooldown.
      - name: "Fűtéstuning padló hőigény mellett hideg puffer"
        unique_id: futestuning_floor_cold_buffer
        default_entity_id: binary_sensor.futestuning_floor_cold_buffer
        device_class: problem
        availability: >-
          {{ is_number(states('sensor.elite_thr316d_sonoff_1002bdc9e4_temperature'))
             and states('switch.padlo_szivattyu_mini_d_sonoff_10029bc9ca_1') in ['on','off'] }}
        state: >-
          {{ is_state('switch.padlo_szivattyu_mini_d_sonoff_10029bc9ca_1','on')
             and states('sensor.elite_thr316d_sonoff_1002bdc9e4_temperature')|float(999) < 30 }}
        delay_on: "00:15:00"
        delay_off: "00:02:00"

      - name: "Fűtéstuning radiátor hőigény mellett hideg puffer"
        unique_id: futestuning_radiator_cold_buffer
        default_entity_id: binary_sensor.futestuning_radiator_cold_buffer
        device_class: problem
        availability: >-
          {{ is_number(states('sensor.elite_thr316d_sonoff_1002bdc9e4_temperature'))
             and states('switch.radiator_szivattyu_mini_d_sonoff_10029bc6bf_1') in ['on','off'] }}
        state: >-
          {{ is_state('switch.radiator_szivattyu_mini_d_sonoff_10029bc6bf_1','on')
             and states('sensor.elite_thr316d_sonoff_1002bdc9e4_temperature')|float(999) < 35 }}
        delay_on: "00:15:00"
        delay_off: "00:02:00"

# History Stats reports MINI-D on-time, *not* verified pump runtime.
# Recorder history must be enabled for the source entities.
sensor:
  - platform: history_stats
    name: "Fűtéstuning pince hőigényjel ideje ma"
    unique_id: futestuning_basement_demand_time_today
    entity_id: switch.pince_szivattyu_mini_d_sonoff_10029bc9f9_1
    state: "on"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: "Fűtéstuning padló hőigényjel ideje ma"
    unique_id: futestuning_floor_demand_time_today
    entity_id: switch.padlo_szivattyu_mini_d_sonoff_10029bc9ca_1
    state: "on"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: "Fűtéstuning radiátor hőigényjel ideje ma"
    unique_id: futestuning_radiator_demand_time_today
    entity_id: switch.radiator_szivattyu_mini_d_sonoff_10029bc6bf_1
    state: "on"
    type: time
    start: "{{ today_at('00:00') }}"
    end: "{{ now() }}"

# Historic temperatures are recorded by the original sensor entities.
# No synthetic trend values or extra temperature sensors are created.
